
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ❤️</title>
    <link rel="stylesheet" href="page2.css">
</head>
<body>

    <div class="background-glow"></div>
    <div class="hearts" id="hearts"></div>

    <div class="welcome-card">

        <div class="top-label">✨ A SPECIAL DAY ✨</div>

        <div class="big-heart">💖</div>

        <h1>HAPPIEST BIRTHDAY PRADEE</h1>

        <div class="sparkle">✦ ───── ♡ ───── ✦</div>

        <p class="birthday-message">
            Don't worry about anything!!
            I'm always there for you..
            <br>
            Be strong my gurlll! ❤️
        </p>

        <div class="cute-line">
            💗 Sirichiteyy irunga pradeepahhh..!! 💗
        </div>

        <div class="bottom-hearts">
            💗 &nbsp; 💕 &nbsp; 💗
        </div>

        <div class="forever-text">
            WITH LOTS OF LOVE ♡
        </div>

    </div>

    <script>
        const heartBox = document.getElementById("hearts");
        const symbols = ["💗", "💕", "💖", "❤️", "✨", "💘"];

        for (let i = 0; i < 35; i++) {
            const heart = document.createElement("span");

            heart.innerHTML =
                symbols[Math.floor(Math.random() * symbols.length)];

            heart.className = "floating-heart";
            heart.style.left = Math.random() * 100 + "%";
            heart.style.animationDuration = (5 + Math.random() * 8) + "s";
            heart.style.animationDelay = Math.random() * 8 + "s";
            heart.style.fontSize = (15 + Math.random() * 25) + "px";

            heartBox.appendChild(heart);
        }
    </script>

    <a href="page3.html" class="next-button">
        See Your Childhood Memories 📸
    </a>

</body>
</html>
